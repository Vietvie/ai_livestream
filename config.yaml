###############################################################################
#  LiveTalking Configuration
#  CLI arguments override values in this file
###############################################################################

# -------- Audio ----------------------------------------------------------
l: 10
m: 8
r: 10

# -------- Avatar Model ----------------------------------------------------------
model: wav2lip                 # use musetalk + a separately prepared avatar for higher quality
avatar_id: wav2lip256_avatar1
batch_size: 16

# -------- Custom Actions ----------------------------------------------------------
customvideo_config: ''

# -------- TTS ----------------------------------------------------------
tts: omnivoice                 # offline Vietnamese TTS; edgetts and sapi remain available
REF_FILE: 'vi-VN-HoaiMyNeural' # Vietnamese EdgeTTS voice; or reference audio/model id
REF_TEXT: ''                   # reference text for voice cloning (English or Chinese)
TTS_SERVER: ''                 # TTS server URL, no trailing slash
omnivoice_model: 'splendor1811/omnivoice-vietnamese'
omnivoice_device: 'auto'       # auto selects cuda:0 on the Windows GPU VPS
omnivoice_dtype: 'float16'
omnivoice_language: 'vietnamese'
omnivoice_instruct: 'female, young adult, moderate pitch'
omnivoice_ref_audio: ''        # optional 3-10 second clean WAV
omnivoice_ref_text: ''         # exact transcript when ref_audio is used
omnivoice_speed: 1.0
omnivoice_num_step: 16         # 16 is a good realtime/quality starting point

# -------- LLM ----------------------------------------------------------
llm_provider: openai           # openai / dashscope / orcarouter
llm_model: 'gpt-4.1-mini'
livestream_config: 'config/livestream.yaml'

# -------- Transport ----------------------------------------------------------
transport: webrtc              # obs / rtcpush / webrtc / rtmp / virtualcam
stun: 'stun:stun.freeswitch.org:3478'  # stun server URL
push_url: ''                   # push URL for rtcpush/rtmp (not needed for webrtc/virtualcam)
obs_url: 'udp://127.0.0.1:23000?pkt_size=1316'
obs_video_encoder: 'libx264'   # reliable default; try h264_nvenc only if PyAV exposes it
obs_video_bitrate: 4000000
max_session: 1                 # one OBS stream; increase only when using multiple sessions
listenport: 8010
